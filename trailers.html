<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trailers — SNAFU PICTURES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Hanken+Grotesk:wght@300;400&display=swap" rel="stylesheet">
  <style>
    @font-face{font-family:'Typeka';src:url('Typeka.otf') format('opentype');}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#080808;color:#f0ece4;font-family:'Hanken Grotesk',sans-serif;}
    a{color:inherit;text-decoration:none;}
    #nav{position:fixed;top:0;left:0;right:0;z-index:100;height:52px;background:rgba(8,8,8,0.95);border-bottom:1px solid #1e1e1e;display:flex;align-items:center;padding:0 1.5rem;gap:1.5rem;}
    .site-title{font-family:'Typeka',Georgia,serif;font-size:1rem;letter-spacing:0.14em;transition:color .25s;}
    .site-title:hover{color:#c8a96e;}
    .nav-tag{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:0.72rem;color:#444;}
    .nav-links{list-style:none;display:flex;align-items:center;gap:1.5rem;margin-left:auto;}
    .nav-links>li>a,.nav-links>li>.dd-toggle{font-family:'Hanken Grotesk',sans-serif;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:#aaa;cursor:pointer;transition:color .25s;white-space:nowrap;}
    .nav-links>li>a:hover,.nav-links>li>.dd-toggle:hover{color:#f0ece4;}
    .nav-email{color:#c8a96e!important;}
    .has-dd{position:relative;}
    .dd-menu{display:none;position:absolute;top:calc(100% + 8px);left:0;background:#111;border:1px solid #2a2a2a;list-style:none;min-width:210px;padding:0.4rem 0;box-shadow:0 12px 40px rgba(0,0,0,0.7);}
    .dd-menu.open{display:block;}
    .dd-menu li a{display:block;padding:0.55rem 1.1rem;font-family:'Hanken Grotesk',sans-serif;font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:#aaa;transition:background .25s,color .25s;}
    .dd-menu li a:hover{background:#1a1a1a;color:#f0ece4;}
    .page-wrap{max-width:900px;margin:0 auto;padding:calc(52px + 3rem) 2rem 6rem;}
    .page-header{margin-bottom:3rem;border-bottom:1px solid #1e1e1e;padding-bottom:1.2rem;}
    .eyebrow{font-family:'Hanken Grotesk',sans-serif;font-size:0.58rem;letter-spacing:0.15em;text-transform:uppercase;color:#c8a96e;margin-bottom:0.4rem;}
    .page-header h1{font-family:'Typeka',Georgia,serif;font-size:clamp(1.4rem,3vw,2.2rem);letter-spacing:0.2em;font-weight:300;}
    .trailer-block{margin-bottom:4rem;}
    .video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;background:#111;}
    .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
    .trailer-meta{margin-top:1.2rem;}
    .trailer-title{font-family:'Typeka',Georgia,serif;font-size:1.1rem;letter-spacing:0.15em;font-weight:300;margin-bottom:0.5rem;}
    .trailer-desc{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:0.88rem;line-height:1.75;color:#aaa;max-width:620px;}
    footer{border-top:1px solid #1e1e1e;text-align:center;padding:1.5rem;font-family:'Hanken Grotesk',sans-serif;font-size:0.55rem;letter-spacing:0.1em;color:#444;}
    footer a{color:#c8a96e;}
  </style>
</head>
<body>
  <nav id="nav">
    <a href="index.html" class="site-title">SNAFU PICTURES</a>
    <span class="nav-tag">The gyre is widening.</span>
    <ul class="nav-links">
      <li><a href="projects.html">Projects</a></li>
      <li class="has-dd"><span class="dd-toggle">Series &#x25BE;</span>
        <ul class="dd-menu">
          <li><a href="signs-of-disrepair.html">Signs of Disrepair</a></li>
          <li><a href="southernmost.html">Southernmost</a></li>
          <li><a href="toothacre.html">Toothacre</a></li>
          <li><a href="outer-dark.html">Outer Dark</a></li>
          <li><a href="creases.html">Creases in the Map</a></li>
          <li><a href="angular.html">anguLAR</a></li>
          <li><a href="trailers.html">Trailers</a></li>
          <li><a href="inquiries.html">Inquiries</a></li>
        </ul>
      </li>
      <li><a href="read-me.html">Read Me</a></li>
      <li><a href="mailto:snafujesus@instagram.com" class="nav-email">Contact</a></li>
    </ul>
  </nav>
  <div class="page-wrap">
    <div class="page-header">
      <div class="eyebrow">Projects /</div>
      <h1>TRAILERS</h1>
    </div>
    <div id="trailers-container"></div>
  </div>
  <footer><p>&copy; SNAFU PICTURES &mdash; <a href="mailto:snafujesus@instagram.com">snafujesus@instagram.com</a></p></footer>
  <script>
    const toggle=document.querySelector('.dd-toggle'),dd=document.querySelector('.dd-menu');
    if(toggle&&dd){toggle.addEventListener('click',e=>{e.stopPropagation();dd.classList.toggle('open');});document.addEventListener('click',()=>dd.classList.remove('open'));}

    fetch('/data/trailers.json?t='+Date.now())
      .then(r=>r.json())
      .then(data=>{
        const container=document.getElementById('trailers-container');
        data.trailers.forEach(t=>{
          const block=document.createElement('div');
          block.className='trailer-block';
          block.innerHTML=
            '<div class="video-wrap"><iframe src="https://player.vimeo.com/video/'+t.vimeo+'?color=c8a96e&title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>'+
            '<div class="trailer-meta">'+
            '<div class="trailer-title">'+t.title+'</div>'+
            '<p class="trailer-desc">'+t.description+'</p>'+
            '</div>';
          container.appendChild(block);
        });
      });
  </script>
</body>
</html>
